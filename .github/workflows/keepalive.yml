# Garde le projet Supabase éveillé : un projet gratuit est mis en pause après une semaine sans activité.
# Deux fois par semaine, une lecture anonyme et sans effet (session_public avec un code inexistant).
# Utilise les variables du dépôt déjà définies pour le déploiement : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
name: Réveil Supabase
on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi, 6 h 17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/session_public" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"ZZZZZZ"}')
          echo "Réponse : $code"
          test "$code" = "200"
